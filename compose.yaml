services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: declic_db
      POSTGRES_USER: declic_user
      POSTGRES_PASSWORD: declic_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U declic_user -d declic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: declic_db
      POSTGRES_USER: declic_user
      POSTGRES_PASSWORD: declic_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login')"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  redis: 
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker_indexing:
    build: .
    entrypoint: []
    command: celery -A config worker --loglevel=info -Q indexing
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,
      POSTGRES_DB: declic_db
      POSTGRES_USER: declic_user
      POSTGRES_PASSWORD: declic_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker_search:
    build: .
    entrypoint: []
    command: celery -A config worker --loglevel=info -Q search
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,
      POSTGRES_DB: declic_db
      POSTGRES_USER: declic_user
      POSTGRES_PASSWORD: declic_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
