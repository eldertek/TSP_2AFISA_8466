{% extends "base.html" %}
{% load i18n %}


{% block title %}{% translate "Indexing" %}{% endblock %}

{% block content %}
    <h1>Indexing</h1>
    <p>Welcome to the Indexing page!</p>
    
    <h2>Indexing Form</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data" action="{% url 'indexing:index' %}">
        {% csrf_token %}
        <label for="album_id">Album:</label>
        <select id="album_id" name="album_id">
            <option value="">-- No album --</option>
            {% for album in albums %}
                <option value="{{ album.id }}">{{ album.name }} ({{ album.event_date|date:"Y-m-d" }})</option>
            {% endfor %}
        </select>

        <label for="album_name">New album name:</label>
        <input type="text" id="album_name" name="album_name">

        <label for="event_date">Event date:</label>
        <input type="datetime-local" id="event_date" name="event_date">

        <label for="photos">Please upload photos:</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple required>
        <button type="submit">Index</button>
    </form>

{% endblock %}
